name: Diagnostics tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure Zsh is available
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y zsh
          fi
      - run: node --test tests/*.test.cjs

  windows-diagnostics:
    name: Windows diagnostics (${{ matrix.powershell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        powershell: [powershell, pwsh]
    env:
      DIAGNOSTICS_POWERSHELL: ${{ matrix.powershell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test native Windows diagnostics
        run: node --test --test-name-pattern="PowerShell is installed in CI|Windows path|native path scripts" tests/diagnostics.test.cjs
